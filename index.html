<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- NRT:HEAD-START -->
<title>Neville Rentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/contract.css">
<!-- NRT:HEAD-END -->
<style>
  /* Safe-area padding for phone home-bar and notch. The hosted build gets
     this from its own skeleton; here we supply it ourselves. */
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { min-height: 100%; }
</style>
</head>
<body>
<!-- NRT:BODY-START -->

<aside class="rail" id="rail">
  <button class="rail__brand" id="brand-home" type="button" style="border:0;background:none;cursor:pointer;text-align:left;padding:0 6px">
    <span class="rail__mark">NRT</span>
    <span>
      <span class="rail__name">Neville Rentals<br>&amp; Transportation</span>
      <span class="rail__sub">Miami, FL</span>
    </span>
  </button>

  <!-- nav is injected here -->

  <div class="rail__foot">
    <button class="nav__item" id="rail-theme" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <span>Theme</span>
    </button>
    <button class="nav__item" id="rail-settings" type="button" hidden>
      <span>Settings</span>
    </button>
  </div>
</aside>

<header class="appbar">
  <span class="appbar__mark">NRT</span>
  <span class="appbar__title" id="appbar-title">Dashboard</span>
  <span class="appbar__spacer"></span>
  <button class="btn btn--ghost btn--sm" id="theme-btn" type="button" aria-label="Change theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</header>

<main class="main" id="main">
  <div class="wrap">
    <div id="view"></div>
  </div>
</main>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<noscript>
  <div style="padding:24px;max-width:38rem;margin:0 auto">
    <h1>Neville Rentals &amp; Transportation</h1>
    <p>This contract system needs JavaScript switched on. Everything runs in your browser —
      nothing is sent anywhere — so there is no server-rendered version to fall back to.</p>
  </div>
</noscript>

<script src="assets/js/util.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/canvas.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/terms.js"></script>
<script src="assets/js/doc.js"></script>
<script src="assets/js/share.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/builder.js"></script>
<script src="assets/js/app.js"></script>
<!-- NRT:BODY-END -->
</body>
</html>
